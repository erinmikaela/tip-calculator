<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.tailwindcss.com"></script>
		<script type="module" src="script.js"></script>
		<link rel="stylesheet" href="style.css" />
		<title>Tip Calculator</title>
	</head>
	<body class="text-white h-screen overflow-hidden">
    <div class="absolute top-1 left-0">
        <img src="Assets/logo.svg" alt="Tip Calculator Logo" class="w-30 h-24">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 h-full gap-6 items-center justify-center mt-16">
        <div class="flex flex-col md:grid-cols-2 items-center">
            <div class="flex flex-col gap-6 bg-white p-8 rounded-md text-slate-900 w-full max-w-md">
                <div class="flex flex-col">
                    <label for="bill" class="text-md font-semibold">Bill</label>
                    <input type="number" id="bill" value="0" class="input">
                </div>
                <div class="flex flex-col">
                    <label for="tip" class="text-md font-semibold">Tip %</label>
                    <div class="flex gap-2">
                        <button id="tip-decrement" class="btn">-</button>
                        <input type="text" id="tip" value="5%" class="input">
                        <button id="tip-increment" class="btn">+</button>
                    </div>
                </div>
                <div class="flex gap-2 mt-2">
                    <button class="btn fixed-tip" data-tip="5">5%</button>
                    <button class="btn fixed-tip" data-tip="10">10%</button>
                    <button class="btn fixed-tip" data-tip="15">15%</button>
                    <button class="btn fixed-tip" data-tip="25">25%</button>
                    <button class="btn fixed-tip" data-tip="50">50%</button>
                </div>
                <div class="flex flex-col">
                    <label for="people" class="text-md font-semibold">Number of People</label>
                    <div class="flex">
                        <button id="people-decrement" class="btn">-</button>
                        <input type="text" id="people" value="1" class="input">
                        <button id="people-increment" class="btn">+</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h2 class="text-md font-semibold">Tip Amount</h2>
                        <span class="per-person hidden">per person</span>
                        <p id="tip-amount" class="text-2xl-bold">₱0.00</p>
                    </div>
                    <div>
                        <h2 class="text-md font-semibold total-label">Total</h2>
                        <span class="per-person hidden">per person</span>
                        <p id="total" class="text-3xl-bold">₱0.00</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col items-center">
            <div class="flex items-center justify-center w-full max-w-lg">
                <img src="Assets/bg-image.svg" alt="Image of bill with tip and restaurant menu" class="w-50 h-50">
            </div>
        </div>
    </div>
	</body>
</html>
